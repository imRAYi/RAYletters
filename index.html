<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حروف مع ريان</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
    opacity: 0.9;
    position: absolute; 
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100%; 
        z-index: -1;
        opacity: 1; 
    background-image: url(BackGround.jpeg);  
    background-size: 100% 100%; 
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;   
            
  }


  header {
  width: 100%;
  background: linear-gradient(135deg, #ff8c00, #ffd700);
  padding: 15px 30px;
  display: flex;
  align-items: center;
  justify-content: flex-end; /* ⬅️ كل العناصر يمين */
  gap: 20px;
  box-shadow: 0 4px 20px rgba(255,140,0,0.4);
  position: relative;
}
  

  header h1 {
    font-size: 2.2rem;
    font-weight: 900;
    color: #1a1a2e;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.3);
    letter-spacing: 1px;
  }

.scores {
  display: flex;
  gap: 20px;
  margin-left: 0px;
  margin-right: 0px;
}

  .team-score {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
    padding: 8px 20px;
    min-width: 100px;
    border: 3px solid transparent;
    transition: border-color 0.3s;
  }

  .team-score.orange { border-color: #ff8c00; }
  .team-score.green { border-color: #2ecc40; }
  .team-score.active-turn { box-shadow: 0 0 15px currentColor; }

  .team-score .team-name {
    font-size: 0.9rem;
    font-weight: 700;
    color: #fff;
  }

  .team-score.orange .team-name { color: #ff8c00; }
  .team-score.green .team-name { color: #2ecc40; }

  .team-score .score-num {
    font-size: 2rem;
    font-weight: 900;
    color: #fff;
  }

  .turn-indicator {
    font-size: 1rem;
    font-weight: 700;
    color: #1a1a2e;
    background: rgba(255,255,255,0.9);
    padding: 6px 18px;
    border-radius: 20px;
  }

  /* Hexagon Grid */
  .board-wrapper {
    margin-top: 30px;
    padding: 20px;
  }

  .hex-grid {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .hex-row {
    display: flex;
    gap: 2px;
  }

  .hex-row:nth-child(even) {
    margin-right: 55px;
    margin-bottom: -29px;
    margin-top: -29px;
  }

  .hex-cell {
    width: 200px;
    height: 215px;
    position: relative;
    cursor: pointer;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 900;
    color: #1a1a2e;
    transition: all 0.3s ease;
    user-select: none;
    margin-bottom: -20px;
  }

  .hex-cell:hover:not(.claimed) {
    background: #e8f4f8;
    transform: scale(1.05);
  }

  .hex-cell.claimed-orange {
    background: #ff8c00;
    color: white;
    cursor: default;
  }

  .hex-cell.claimed-green {
    background: #2ecc40;
    color: white;
    cursor: default;
  }

  .hex-cell.claimed { cursor: default; }

  .hex-cell.pulse {
    animation: pulse 0.5s ease;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: #fff;
    border-radius: 20px;
    padding: 40px;
    max-width: 500px;
    width: 90%;
    text-align: center;
    animation: slideIn 0.3s ease;
    position: relative;
    border-top: 8px solid;
  }

  .modal.orange-modal { border-color: #ff8c00; }
  .modal.green-modal { border-color: #2ecc40; }

  @keyframes slideIn {
    from { transform: translateY(-30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal h2 {
    font-size: 1.5rem;
    color: #666;
    margin-bottom: 10px;
  }

  .modal .letter-display {
    font-size: 5rem;
    font-weight: 900;
    color: #1a1a2e;
    line-height: 1;
    margin: 10px 0;
  }

  .modal .question {
    font-size: 1.4rem;
    font-weight: 700;
    color: #333;
    background: #f5f5f5;
    padding: 20px;
    border-radius: 12px;
    margin: 20px 0;
    line-height: 1.6;
  }

  .modal .answer {
    font-size: 1.6rem;
    font-weight: 900;
    color: #fff;
    padding: 15px 30px;
    border-radius: 12px;
    margin: 15px 0;
    display: none;
  }

  .modal .answer.orange-answer { background: #ff8c00; }
  .modal .answer.green-answer { background: #2ecc40; }

  .btn {
    display: inline-block;
    padding: 12px 30px;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: 700;
    font-family: 'Tajawal', sans-serif;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    margin: 5px;
  }

  .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
  .btn:active { transform: translateY(0); }

  .btn-reveal { background: #1a1a2e; color: white; 
  }

  .btn-orange-win { background: #ff8c00; color: white; }
  .btn-green-win { background: #2ecc40; color: white; }
  .btn-skip { background: #ddd; color: #666; }

  .action-buttons { display: none; margin-top: 15px; }
  .action-buttons.visible { display: block; }

  /* Win screen */
  .win-screen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,0.85);
  }

  .win-screen.active { display: flex; }

  .win-content {
    text-align: center;
    color: white;
    animation: zoomIn 0.5s ease;
  }

  @keyframes zoomIn {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .win-content h1 {
    font-size: 4rem;
    font-weight: 900;
    margin-bottom: 10px;
  }

  .win-content p {
    font-size: 1.5rem;
    margin-bottom: 30px;
  }

  .btn-restart { background: #ffd700; color: #1a1a2e; font-size: 1.3rem; padding: 15px 40px; }

.setup-screen {
  display: flex;
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at top, #2a2a4e, #0f0f1f);
  z-index: 300;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
}
  

  .setup-screen h1 {
    font-size: 3rem;
    font-weight: 900;
    color: #ffd700;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.3);
  }

  .setup-screen p {
    color: #aaa;
    font-size: 1.1rem;
    text-align: center;
    max-width: 400px;
  }

  .team-setup {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .setup-logo {
  width: 180px;
  margin-bottom: 10px;
  filter: drop-shadow(0 10px 25px rgba(255,215,0,0.35));
  }

  .team-box {
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    padding: 25px 30px;
    border: 3px solid;
    text-align: center;
    min-width: 180px;
  }

  .team-box.orange { border-color: #ff8c00; }
  .team-box.green { border-color: #2ecc40; }

  .team-box label {
    display: block;
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .team-box.orange label { color: #ff8c00; }
  .team-box.green label { color: #2ecc40; }

  .team-box input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 2px solid #ddd;
    font-size: 1rem;
    font-family: 'Tajawal', sans-serif;
    text-align: center;
    background: #fff;
  }

  .btn-start {
    background: linear-gradient(135deg, #ff8c00, #ffd700);
    color: #1a1a2e;
    font-size: 1.4rem;
    padding: 15px 50px;
    border-radius: 14px;
    font-weight: 900;
  }

  .category-tag {
    font-size: 0.85rem;
    color: #888;
    margin-top: 5px;
  }

.Logo {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;   /* ⬅️ حجم مناسب */
  height: auto;
}
  
</style>
</head>
<body>

<!-- Setup Screen -->
<div class="setup-screen" id="setupScreen">
  <img src="Logo.png" class="setup-logo" alt="Logo">
  <div class="team-setup">
    <div class="team-box orange">
      <label>🟠 اسم الفريق البرتقالي</label>
      <input type="text" id="orangeName" value="الفريق البرتقالي" />
    </div>
    <div class="team-box green">
      <label>🟢 اسم الفريق الأخضر</label>
      <input type="text" id="greenName" value="الفريق الأخضر" />
    </div>
  </div>
  <button class="btn btn-start" onclick="startGame()">ابدأ اللعبة!</button>
</div>

<!-- Header -->
<header>
  <button class="btn btn-reveal" style="background: #1a1a2e; font-size: 0.8rem; padding: 5px 15px;" onclick="openRoundModal()">🏆 فائز الجولة</button>

<div class="modal-overlay" id="roundWinnerOverlay">
  <div class="modal" style="border-top: 8px solid #ffd700;">
    <h2>نهاية الجولة الأولى</h2>
    <div class="question">اختر الفريق الفائز بهذه الجولة:</div>
    <div class="action-buttons visible">
      <button class="btn btn-orange-win" id="roundOrangeBtn" onclick="announceRoundWinner('orange')"></button>
      <button class="btn btn-green-win" id="roundGreenBtn" onclick="announceRoundWinner('green')"></button>
    </div>
    <button class="btn btn-skip" onclick="closeRoundModal()">إلغاء</button>
  </div>
</div>
  <div class="scores">
    <div class="team-score orange" id="scoreOrange">
      <span class="team-name" id="orangeLabel">برتقالي</span>
      <span class="score-num" id="orangeScore">0</span>
    </div>
    <div class="team-score green" id="scoreGreen">
      <span class="team-name" id="greenLabel">أخضر</span>
      <span class="score-num" id="greenScore">0</span>
    </div>
  </div>
  <img class="Logo" src="Logo.png" alt="Image Can't Load">
  <div class="turn-indicator" id="turnIndicator">دور الفريق البرتقالي 🟠</div>
</header>

<!-- Board -->
<div class="board-wrapper">
  <div class="hex-grid" id="hexGrid"></div>
</div>

<!-- Question Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="questionModal">
    <h2>السؤال عن حرف</h2>
    <div class="letter-display" id="modalLetter">ب</div>
    <div class="question" id="questionText">السؤال يظهر هنا...</div>
    <div class="category-tag" id="categoryTag"></div>
    <button class="btn btn-reveal" onclick="revealAnswer()">🔍 اظهر الإجابة</button>
    <div class="answer" id="answerText"></div>
    <div class="action-buttons" id="actionButtons">
      <button class="btn btn-orange-win" id="btnOrangeWin" onclick="claimCell('orange')">✅ فاز البرتقالي</button>
      <button class="btn btn-green-win" id="btnGreenWin" onclick="claimCell('green')">✅ فاز الأخضر</button>
      <button class="btn btn-skip" onclick="skipTurn()">❌ لا أحد</button>
    </div>
  </div>
</div>

<!-- Win Screen -->
<div class="win-screen" id="winScreen">
  <div class="win-content">
    <h1 id="winTitle">🏆 فاز الفريق!</h1>
    <p id="winSubtitle">النتيجة النهائية</p>
    <button class="btn btn-restart" onclick="location.reload()">🔄 العب مرة ثانية</button>
  </div>
</div>

<script>
  // دالة لفتح نافذة اختيار فائز الجولة
function openRoundModal() {
  document.getElementById('roundOrangeBtn').textContent = teamNames.orange;
  document.getElementById('roundGreenBtn').textContent = teamNames.green;
  document.getElementById('roundWinnerOverlay').classList.add('active');
}

// دالة لإغلاق النافذة
function closeRoundModal() {
  document.getElementById('roundWinnerOverlay').classList.remove('active');
}

// دالة إعلان فائز الجولة
function announceRoundWinner(winnerSide) {
  const winnerName = teamNames[winnerSide];
  closeRoundModal();
  
  const winScreen = document.getElementById('winScreen');
  document.getElementById('winTitle').textContent = `مبرووووك فريق "${winnerName}"`;
  document.getElementById('winSubtitle').textContent = `لقد فزتم بالجولة الأولى بنجاح! 👏`;
  winScreen.classList.add('active');
  
  const restartBtn = document.querySelector('.btn-restart');
  restartBtn.textContent = "🔄 الاستمرار للجولة التالية";
  
  // التعديل هنا: بدلاً من reload، سنقوم بتصفير اللعبة وبدء جولة جديدة
  restartBtn.onclick = function() {
      winScreen.classList.remove('active');
      startNextRound(); // استدعاء دالة الجولة الجديدة
  };
}
function startNextRound() {
  // 1. تصفير النقاط في الذاكرة وفي واجهة المستخدم
  scores.orange = 0;
  scores.green = 0;
  document.getElementById('orangeScore').textContent = '0';
  document.getElementById('greenScore').textContent = '0';

  // 2. إعادة تعيين الدور للبرتقالي (أو أي فريق تختارينه)
  currentTurn = 'orange';
  updateTurnUI();

  // 3. مسح مصفوفة الخلايا القديمة
  cells = [];
  
  // 4. استدعاء دالة بناء الشبكة مرة أخرى
  // لأنها تحتوي على [...letters].sort(() => Math.random() - 0.5)
  // ستقوم تلقائياً بتغيير أماكن الحروف في كل مرة تُستدعى فيها
  buildGrid();
}
const letters = ['أ','ب','ت','ث','ج','ح','خ','د','ذ','ر','ز','س','ش','ص','ض','ط','ظ','ع','غ','ف','ق','ك','ل','م','ن','ه','و'];

const questions = {
  'أ': [{ q: 'ما هو الاسم الذي أطلقه المسلمون على شبه جزيرة أيبيريا؟', a: 'الأندلس', cat: 'تاريخ' }, { q: 'ا هو العنصر الكيميائي الذي يشكل حوالي 21% من الغلاف الجوي للأرض؟', a: 'الأكسجين', cat: 'علوم' }],
  'ب': [{ q: 'ما هي العاصمة الرسمية لدولة البرازيل؟', a: 'برازيليا', cat: 'جغرافيا' }, { q: 'حضارة قديمة اشتهرت بحدائقها المعلقة؟', a: 'بابل', cat: 'تاريخ' }],
  'ت': [{ q: 'عملية تحويل البيانات إلى رموز غير مفهومة؟', a: 'تشفير', cat: 'تقنية' }, { q: 'سفينة ركاب إنقليزية ضخمة انطلقت في اول رحلة لها في 1912م', a: 'تايتانك', cat: 'تاريخ' }],
  'ث': [{ q: 'جرم سماوي في الفضاء يتميز بجاذبية فائقة القوة تمنع حتى الضوء من الإفلات منها؟', a: 'ثقب أسود', cat: 'فلك' }, { q: 'مصطلح فيزيائي يعبر عن قدرة الجسم على العودة لوضعه الأصلي بعد زوال القوة المؤثرة عليه؟', a: 'ثبات', cat: 'علوم' }],
  'ج': [{ q: 'دولة عربية تقع في منطقة القرن الأفريقي وتطل على مضيق باب المندب الاستراتيجي؟', a: 'جيبوتي', cat: 'جغرافيا' }, { q: 'القائد المغولي الذي أسس واحدة من أكبر الإمبراطوريات في التاريخ الممتدة عبر آسيا وأوروبا؟', a: 'جنكيز خان', cat: 'تاريخ' }],
  'ح': [{ q: 'حمى: ارتفاع درجة حرارة الجسم فوق المعدل الطبيعي كاستجابة مناعية للعدوى؟', a: 'حمى', cat: 'أمراض' }, { q: 'شاعر عربي من الجاهلية، أصبح اسمه مضرباً للمثل في الكرم والسخاء؟', a: 'حاتم الطائي', cat: 'تاريخ' }],
  'خ': [{ q: 'الفرعون المصري الذي بنى الهرم الأكبر في الجيزة، وهو أحد عجائب الدنيا السبع؟', a: 'خوفو', cat: 'تاريخ' }, { q: 'صطلح في الأرصاد الجوية يشير إلى المنطقة الفاصلة بين كتلتين هوائيتين مختلفتين؟', a: 'جبهة', cat: 'علوم' }],
  'د': [{ q: 'فن إدارة العلاقات الدولية والتفاوض بين الدول بدلاً من الصراع؟', a: 'دبلوماسية', cat: 'مصطلحات' }, { q: 'سائل ملحي تفرزه العين لحمايتها وترطيبها؟', a: 'دموع', cat: 'علوم' }],
  'ذ': [{ q: 'ملك عادل ورد ذكره في القرآن الكريم قام ببناء سد لمنع يأجوج ومأجوج؟', a: 'ذو القرنين', cat: 'تاريخ' }, { q: 'المصطلح العلمي الذي يشير إلى الحركة التكرارية حول نقطة توازن؟', a: 'ذبذبة', cat: 'علوم' }],
  'ر': [{ q: 'نظام يستخدم موجات الراديو للكشف عن الأجسام وتحديد سرعتها واتجاه حركتها؟', a: 'رادار', cat: 'تقنية' }, { q: 'العملة الرسمية لدولة روسيا الاتحادية وتعتبر من أقدم العملات في العالم؟', a: 'روبل', cat: 'تاريخ' }],
  'ز': [{ q: 'ظاهرة طبيعية ناتجة عن تحرك الصفائح التكتونية للأرض، وتُقاس قوتها بجهاز "السيزموغراف"؟', a: 'الزلزال', cat: 'الجيلوجيا' }, { q: 'الكوكب الذي يُلقب بـ "توأم الأرض" وهو أشد كواكب المجموعة الشمسية حرارة؟', a: 'الزهرة', cat: 'فلك' }],
  'س': [{ q: 'فيلسوف يوناني شهير لم يترك كتباً لم يقرأه؟', a: 'سقراط', cat: 'تاريخ' }, { q: '', a: '', cat: '' }],
  'ش': [{ q: 'الوعاء الدموي الذي ينقل الدم الغني بالأكسجين من القلب إلى باقي أجزاء الجسم؟', a: 'شريان', cat: 'طب' }, { q: 'خاصية فيزيائية للمادة قد تكون "موجبة" أو "سالبة" وهي المسؤولة عن القوى الكهرومغناطيسية؟', a: 'شحنة كهربائية', cat: 'علوم' }],
  'ص': [{ q: 'القائد العسكري الذي أسس الدولة الأيوبية واستعاد مدينة القدس في معركة حطين؟', a: 'صلاح الدين الأيوبي', cat: 'تاريخ' }, { q: 'أكبر صحراء رملية متصلة في العالم', a: 'صحراء الربع الخالي', cat: 'جغرافيا' }],
  'ض': [{ q: 'زن عمود الهواء الواقع على وحدة المساحة، ويقل كلما ارتفعنا عن مستوى سطح البحر؟', a: 'ضغط جوي', cat: 'علوم' }, { q: 'مبلغ مالي تفرضه الدوله على الافراد والشركات', a: 'ضريبة', cat: 'علوم عامة' }],
  'ط': [{ q: 'كائنات حية تعيش داخل كائن حي آخر وتتغذى من غذائه وتسبب له الضرر؟', a: 'طفيليات', cat: 'علوم' }, { q: 'الجبل الذي ورد ذكره في القرآن الكريم وكلم الله عليه موسى -عليه السلام- تكليماً؟', a: 'طور', cat: 'تاريخ' }],
  'ظ': [{ q: 'المناطق المظلمة التي تتشكل عندما يحجب جسم عتيم الضوء عن السطح؟', a: 'ظلال', cat: 'علوم' }, { q: 'المصطلح الذي يُطلق على أحداث مثل الكسوف والخسوف ومرور المذنبات؟', a: 'ظواهر فلكية', cat: 'فلك' }],
  'ع': [{ q: 'قطعة من الزجاج أو البلاستيك الشفاف تستخدم لكسر الضوء؟', a: 'عدسة', cat: 'علوم عامة' }, { q: 'حزمة من الألياف تنقل الإشارات الكهربائية بين الدماغ وأجزاء الجسم المختلفة؟', a: 'عصب', cat: 'طب' }],
  'غ': [{ q: 'طبقة من الغازات المحيطة بالكوكب، تحميه من النيازك والأشعة الضارة؟', a: 'غلاف جوي', cat: 'فلك' }, { q: 'غدة في جسم الإنسان تشبه الفراشة', a: 'الغدة الدرقية', cat: 'طب' }],
  'ف': [{ q: 'الم رياضيات يوناني صاحب النظرية الشهيرة في حساب أضلاع المثلث القائم الزاوية؟', a: 'فيثاغورس', cat: 'شخصيات' }, { q: 'ركبات عضوية يحتاجها الجسم بكميات ضئيلة للنمو؟', a: 'فيتامينات', cat: 'طب' }],
  'ق': [{ q: 'النقطة الجغرافية التي تقع في أقصى شمال الأرض', a: 'القطب الشمالي', cat: 'جغرافيا' }, { q: 'كتل يابسة ضخمة تشكل سطح الأرض، منقسمة الى اقسام جغرافية معتمدة', a: 'قارات', cat: 'جغرافيا' }],
  'ك': [{ q: 'ملاح إيطالي شهير تنسب إليه اكتشاف احد القارات في عام 1492م؟', a: 'كولومبوس', cat: 'تاريخ' }, { q: 'العلم الذي يدرس المادة وتركيبها وخصائصها والتفاعلات التي تطرأ عليها؟', a: 'كيمياء', cat: 'علوم' }],
  'ل': [{ q: 'مدينة عريقة تُلقب بـ "مدينة الضباب" فما هي ؟', a: 'لندن', cat: 'جغرافيا' }, { q: 'شخصية صالحة ورد ذكرها في القرآن الكريم، واشتهرت بالحكمة البالغة والوصايا العظيمة لابنه؟', a: 'لقمان الحكيم', cat: 'شخصيات' }],
  'م': [{ q: 'الدولة التي ينتمي إليها القائد جنكيز خان وتعتبر من أقل دول العالم كثافة سكانية؟', a: 'منغوليا', cat: 'جغرافيا' }, { q: 'ما هو الاسم الذي يُطلق على النظام القديم لتبادل السلع؟', a: 'مقايضة', cat: 'مصطلحات' }],
  'ن': [{ q: 'القائد العسكري الفرنسي الذي أسس إمبراطورية ضخمة وسيطر على معظم أوروبا في مطلع القرن التاسع عشر؟', a: 'نابليون', cat: 'تاريخ' }, { q: 'الحزمة العصبية التي تمر داخل العمود الفقري وتربط الدماغ بجميع أعضاء الجسم؟', a: 'نخاع شوكي', cat: 'طب' }],
  'ه': [{ q: 'أعلى سلسلة جبال على وجه الأرض', a: 'هامالايا', cat: 'جغرافيا' }, { q: 'الدولة الأوروبية التي تُلقب بـ "الأراضي المنخفضة" وتشتهر بزراعة التوليب وطواحين الهواء؟', a: 'هولاندا', cat: 'جغرافيا' }],
  'و': [{ q: 'المصطلح الذي يُطلق على الانتشار السريع لمرض معدٍ في منطقة واسعة أو في العالم كله؟', a: 'وباء', cat: 'علوم' }, { q: 'الوعاء الدموي في الجسم الذي يقوم بنقل الدم من الأطراف والأعضاء باتجاه القلب؟', a: 'وريد', cat: 'طب' }],
  'ي': [{ q: 'عنصر كيميائي مشع وثقيل يُستخدم كوقود أساسي لإنتاج الطاقة في المفاعلات النووية؟', a: 'يورانيوم', cat: 'علوم' }, { q: 'معركة حاسمة وقعت عام 636م بين المسلمين والروم، فتحت الطريق لانتشار الإسلام في بلاد الشام؟', a: 'يرموك', cat: 'تاريخ' }],
};
// Grid layout: rows of hexes (matching the image - 5 columns roughly)
const gridLayout = [5, 4, 5, 4, 5];

let cells = [];
let currentCell = null;
let currentTurn = 'orange';
let scores = { orange: 0, green: 0 };
let teamNames = { orange: 'الفريق البرتقالي', green: 'الفريق الأخضر' };

function startGame() {
  teamNames.orange = document.getElementById('orangeName').value || 'الفريق البرتقالي';
  teamNames.green = document.getElementById('greenName').value || 'الفريق الأخضر';
  document.getElementById('orangeLabel').textContent = teamNames.orange;
  document.getElementById('greenLabel').textContent = teamNames.green;
  document.getElementById('setupScreen').style.display = 'none';
  buildGrid();
  updateTurnUI();
}

function buildGrid() {
  const grid = document.getElementById('hexGrid');
  grid.innerHTML = '';
  cells = [];

  const shuffled = [...letters].sort(() => Math.random() - 0.5);
  let idx = 0;

  gridLayout.forEach((count, rowIdx) => {
    const row = document.createElement('div');
    row.className = 'hex-row';
    if (rowIdx % 2 !== 0) row.style.marginLeft = '52px';

    for (let i = 0; i < count; i++) {
      const letter = shuffled[idx % shuffled.length];
      idx++;
      const cell = document.createElement('div');
      cell.className = 'hex-cell';
      cell.textContent = letter;
      cell.dataset.letter = letter;
      cell.dataset.claimed = 'false';
      cell.addEventListener('click', () => onCellClick(cell));
      row.appendChild(cell);
      cells.push(cell);
    }
    grid.appendChild(row);
  });
}

function onCellClick(cell) {
  if (cell.dataset.claimed === 'true') return;
  currentCell = cell;
  const letter = cell.dataset.letter;

  document.getElementById('modalLetter').textContent = letter;

  const qList = questions[letter] || [{ q: `اذكر كلمة تبدأ بحرف (${letter})`, a: 'أي كلمة صحيحة', cat: 'لغة' }];
  const q = qList[Math.floor(Math.random() * qList.length)];

  document.getElementById('questionText').textContent = q.q;
  document.getElementById('categoryTag').textContent = '📂 ' + q.cat;

  const answerEl = document.getElementById('answerText');
  answerEl.textContent = '✅ الإجابة: ' + q.a;
  answerEl.style.display = 'none';
  answerEl.className = 'answer';

  document.getElementById('actionButtons').className = 'action-buttons';

  const modal = document.getElementById('questionModal');
  modal.className = 'modal ' + (currentTurn === 'orange' ? 'orange-modal' : 'green-modal');

  document.getElementById('btnOrangeWin').textContent = `✅ فاز ${teamNames.orange}`;
  document.getElementById('btnGreenWin').textContent = `✅ فاز ${teamNames.green}`;

  document.getElementById('modalOverlay').classList.add('active');
}

function revealAnswer() {
  const answerEl = document.getElementById('answerText');
  answerEl.style.display = 'block';
  answerEl.className = 'answer ' + (currentTurn === 'orange' ? 'orange-answer' : 'green-answer');
  document.getElementById('actionButtons').className = 'action-buttons visible';
}

function claimCell(winner) {
  if (!currentCell) return;
  currentCell.dataset.claimed = 'true';
  currentCell.classList.add('claimed', 'claimed-' + winner, 'pulse');
  scores[winner]++;
  document.getElementById('orangeScore').textContent = scores.orange;
  document.getElementById('greenScore').textContent = scores.green;

  closeModal();
  switchTurn();
  checkWin();
}

function skipTurn() {
  closeModal();
  switchTurn();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  currentCell = null;
}

function switchTurn() {
  currentTurn = currentTurn === 'orange' ? 'green' : 'orange';
  updateTurnUI();
}

function updateTurnUI() {
  const name = teamNames[currentTurn];
  const emoji = currentTurn === 'orange' ? '🟠' : '🟢';
  document.getElementById('turnIndicator').textContent = `دور ${name} ${emoji}`;
}

function checkWin() {
  const total = cells.length;
  const claimed = cells.filter(c => c.dataset.claimed === 'true').length;
  if (claimed === total) {
    const winner = scores.orange > scores.green ? teamNames.orange : scores.green > scores.orange ? teamNames.green : null;
    const winScreen = document.getElementById('winScreen');
    winScreen.classList.add('active');
    if (winner) {
      document.getElementById('winTitle').textContent = `🏆 فاز ${winner}!`;
    } else {
      document.getElementById('winTitle').textContent = '🤝 تعادل!';
    }
    document.getElementById('winSubtitle').textContent = `${teamNames.orange}: ${scores.orange} | ${teamNames.green}: ${scores.green}`;
  }
}
</script>
